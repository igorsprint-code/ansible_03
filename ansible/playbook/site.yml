---

### clickhouse
- name: Install Clickhouse
  hosts: clickhouse
  become: true
  handlers:
    - name: Start clickhouse service
      become: true
      ansible.builtin.service:
        name: clickhouse-server
        state: restarted
        enabled: true
      tags:
        - clickhouse
        - start service

  tasks:
    - name: Get clickhouse distrib
      ansible.builtin.get_url:
        url: "https://packages.clickhouse.com/deb/pool/main/c/{{ item }}/{{ item }}_{{ clickhouse_version }}_amd64.deb"
        dest: "/tmp/{{ item }}_{{ clickhouse_version }}_amd64.deb"
        mode: '0644'

      with_items: "{{ clickhouse_packages }}"
      tags:
        - clickhouse
        - distr

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install clickhouse packages
      become: true
      ansible.builtin.apt:
        deb: "/tmp/{{ item }}_{{ clickhouse_version }}_amd64.deb"
      loop:
        - clickhouse-common-static
        - clickhouse-client
        - clickhouse-server
      notify: Start clickhouse service
      tags:
        - clickhouse
        - distr


    - name: Flush handlers
      ansible.builtin.meta: flush_handlers
      tags:
        - clickhouse
        - start service

    - name: Wait for clickhouse
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 9000
        state: started
        timeout: 300
      tags:
        - clickhouse
        - wait
    - name: Create database
      ansible.builtin.command: "clickhouse-client -q 'create database logs;'"
      register: create_db
      failed_when: create_db.rc != 0 and create_db.rc != 82
      changed_when: create_db.rc == 0
      tags:
        - clickhouse
        - db

### vector

- name: Install Vector
  hosts: vector
  become: true
  handlers:
    - name: Start vector service
      become: true
      ansible.builtin.service:
        name: vector
        state: restarted
        enabled: true
      tags:
        - vector
        - restarservice
  tasks:
    - name: Get vector distrib
      ansible.builtin.get_url:
        url: "https://packages.timber.io/vector/{{ vector_version }}/vector_{{ vector_version }}-1_amd64.deb"
        dest: "./vector_{{ vector_version }}_amd64.deb"
        mode: '0644'
      tags:
        - vector
        - distr

    - name: Update apt cache
      become: true
      ansible.builtin.apt:
        update_cache: true
      tags:
        - vector
        - update
    - name: Install vector packages
      become: true
      ansible.builtin.apt:
        deb: "./vector_{{ vector_version }}_amd64.deb"
      notify: Start vector service
      tags:
        - vector
        - distr

    - name: Config vector
      become: true
      ansible.builtin.template:
        src: "templates/vector.yaml.j2"
        dest: "/etc/vector/vector.yaml"
        mode: '0644'
      notify: Start vector service
      tags:
        - vector
        - config

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers
      tags:
        - vector
        - restart service

### nginx


- name: Install nginx
  hosts: lighthouse
  become: true
  handlers:
    - name: Start nginx service
      become: true
      ansible.builtin.service:
        name: nginx
        state: restarted
        enabled: true
      tags:
        - nginx
        - start service

  tasks:
    - name: Update apt cache
      become: true
      ansible.builtin.apt:
        update_cache: true
      tags:
        - nginx
        - update

    - name: Install nginx
      become: true
      ansible.builtin.package:
        name:
          - nginx
        state: present
      notify: Start nginx service
      tags:
        - nginx
        - install

### lighthouse

- name: Install lighthouse
  hosts: lighthouse
  become: true

  handlers:
    - name: Start nginx service
      become: true
      ansible.builtin.service:
        name: nginx
        state: restarted
        enabled: true
      tags:
        - lighthouse
        - restart nginx

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      tags:
        - lighthouse
        - update

    - name: Clone lighthouse repository
      ansible.builtin.git:
        repo: "{{ lighthouse_repo }}"
        dest: "{{ lighthouse_dest }}"
        depth: 1
        version: master
      tags:
        - lighthouse
        - clone

    - name: Create lighthouse directory
      ansible.builtin.file:
        path: /var/www/lighthouse
        state: directory
        mode: '0755'
      tags:
        - lighthouse
        - create_directory

    - name: Copy lighthouse files
      ansible.builtin.copy:
        src: "{{ lighthouse_dest }}/"
        dest: /var/www/lighthouse
        remote_src: true
        mode: preserve
      tags:
        - lighthouse
        - copy_files

    - name: Nginx conf
      ansible.builtin.template:
        src: ./templates/lighthouse_nginx.conf.j2
        dest: /etc/nginx/sites-available/lighthouse
        mode: "0644"
      notify: Start nginx service
      tags:
        - lighthouse
        - nginx_conf

    - name: Enable site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/lighthouse
        dest: /etc/nginx/sites-enabled/lighthouse
        state: link
      notify: Start nginx service
      tags:
        - lighthouse
        - nginx_site_enable
