---
- name: Install Clickhouse
  hosts: clickhouse
  handlers:
    - name: Start clickhouse service
      become: true
      ansible.builtin.service:
        name: clickhouse-server
        state: restarted
  tasks:
    - block:
        - name: Get clickhouse distrib
          ansible.builtin.get_url:
            url: "https://packages.clickhouse.com/deb/pool/main/c/{{ item }}/{{ item }}_{{ clickhouse_version }}_amd64.deb"
            dest: "./{{ item }}_{{ clickhouse_version }}_amd64.deb"
          with_items: "{{ clickhouse_packages }}"
      rescue:
        - name: Get clickhouse distrib
          ansible.builtin.get_url:
            url: "https://packages.clickhouse.com/rpm/stable/clickhouse-common-static-{{ clickhouse_version }}.x86_64.rpm"
            dest: "./clickhouse-common-static-{{ clickhouse_version }}.rpm"
    - name: Install clickhouse packages
      become: true
      ansible.builtin.apt:
        deb: "./{{ item }}_{{ clickhouse_version }}_amd64.deb"
      loop:
        - clickhouse-common-static
        - clickhouse-client
        - clickhouse-server          
      notify: Start clickhouse service
    
    - name: Flush handlers
      meta: flush_handlers

    - name: wait for clickhouse
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 9000
        state: started
        timeout: 60
    
    - name: Create database
      ansible.builtin.command: "clickhouse-client -q 'create database logs;'"
      register: create_db
      failed_when: create_db.rc != 0 and create_db.rc != 82
      changed_when: create_db.rc == 0
      tags:
        - clickhouse
        - db


- name: Install Vector
  hosts: clickhouse
  handlers:
    - name: Start vector service
      become: true
      ansible.builtin.service:
        name: vector
        state: restarted
        enabled: yes
  
  tasks:
    - name: Get vector distrib
      ansible.builtin.get_url:
        url: "https://packages.timber.io/vector/{{ vector_version }}/vector_{{ vector_version }}-1_amd64.deb"
        dest: "./vector_{{ vector_version }}_amd64.deb"

    - name: Install vector packages
      become: true
      ansible.builtin.apt:
        deb: "./vector_{{ vector_version }}_amd64.deb"
      notify: Start vector service

    - name: Config vector
      become: true
      template:
        src: "templates/vector.yaml.j2"
        dest: "/etc/vector/vector.yaml"
      notify: Start vector service

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers
      tags:
        - vector
        - restart service